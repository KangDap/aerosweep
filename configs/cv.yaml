path: data/vision
train: processed/train/images
val: processed/val/images
test: raw/images
nc: 20
names:
  0: Rubble
  1: Construction and demolition materials
  2: Asphalt milling
  3: Excavation materials
  4: Appliances
  5: Electronic equipment
  6: Furniture
  7: Metal barrels
  8: Plastic packaging
  9: Wood
  10: Pallets
  11: Scrap
  12: Plastic
  13: Vehicles
  14: Tyres
  15: Paper
  16: Foundry
  17: Asbestos
  18: Textile
  19: Mixed items
preprocessing:
  patch_size: 512
  overlap: 0.2
  train_val_split: 0.8
  random_seed: 42
  grid_naming_pattern: '{image_stem}_grid_{row}_{col}'
  min_visibility: 0.1
training:
  model: yolo11n-seg.pt
  epochs: 100
  batch: 16
  imgsz: 512
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  patience: 20
  project: models/nn_weights
  name: aerosweep_trained
  save_period: -1
  device: 0
  workers: 8
  augment: true
  seed: 42
  verbose: true
inference:
  model_path: models\nn_weights\aerosweep_trained\weights\best.pt
  source: data/vision/processed/val/images
  conf_threshold: 0.25
  iou_threshold: 0.45
  device: 0
  imgsz: 512
  output_dir: outputs
  output_csv: output_fitur_ann_ke_fuzzy.csv
  visualize: false
  save_annotated: true
  annotated_dir: outputs/annotated_grids
